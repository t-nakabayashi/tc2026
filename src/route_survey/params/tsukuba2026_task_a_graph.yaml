# 選択課題A（市役所職員駐車場3）の通路網。
#
# 座標は現地の観測値である。航空写真や OpenStreetMap から求めた値ではない。
# G は本走行コースの分割点 WP0738 と同じ位置で、歩道上にある。ロボットはここで左折し、
# 歩道と駐車場の境界である O2 から進入する。道路と駐車場を結ぶ進入路の道路側の端
# (36.0833017, 140.0786401) は経路に使わない。
#
# 回避幅は駐車場の通路として左右1.5 mを与える。車体幅0.6 mに対し、車体端で1 m強の
# 横移動を許す値である。通路幅は航空写真で3.7〜4.9 mであり、通路が狭いときは
# lidar_layer_slicer の実測空き幅が上限を縛る。停車車両からの離隔はそちらで決まる。
spacing_m: 0.75
right_is_open: 1.5
left_is_open: 1.5
start: G
goal: G
checkpoints:
  - O11

nodes:
  G:   {latitude: 36.0833637, longitude: 140.0786430, note: 本走行コース上の分割点 WP0738}
  O2:  {latitude: 36.0834229, longitude: 140.0786491, note: ゲート（歩道と駐車場の境界）}
  O3:  {latitude: 36.0836196, longitude: 140.0786783, note: 西側への分岐}
  O4:  {latitude: 36.0836212, longitude: 140.0787078, note: 東側・北側への分岐}
  O5:  {latitude: 36.0841799, longitude: 140.0787648, note: 北側通路の分岐}
  O6:  {latitude: 36.0841926, longitude: 140.0785878, note: 北側通路の西端}
  O7:  {latitude: 36.0836301, longitude: 140.0785385, note: 横断通路の西端}
  O8:  {latitude: 36.0836128, longitude: 140.0788737, note: 横断通路と南北通路2の交点}
  O9:  {latitude: 36.0841051, longitude: 140.0789344, note: 北側通路と南北通路2の交点}
  O10: {latitude: 36.0836017, longitude: 140.0790538, note: 横断通路と南北通路3の交点}
  O11: {latitude: 36.0840057, longitude: 140.0791011, note: チェックポイント}
  O12: {latitude: 36.0835919, longitude: 140.0792201, note: 横断通路の東端}
  O13: {latitude: 36.0839000, longitude: 140.0792617, note: 北東の斜辺の折れ点}

edges:
  - {source: G,   target: O2,  note: ゲートへ入る}
  - {source: O2,  target: O3,  note: 進入路（区画内）}
  - {source: O3,  target: O4,  note: 分岐どうしの連絡}
  - {source: O3,  target: O7,  note: 横断通路 西}
  - {source: O7,  target: O6,  note: 車両出入口3と4の間の南北通路}
  - {source: O6,  target: O5,  note: 北側通路 西}
  - {source: O4,  target: O5,  note: 南北通路 1}
  - {source: O4,  target: O8,  note: 横断通路 中}
  - {source: O8,  target: O10, note: 横断通路 東}
  - {source: O10, target: O12, note: 横断通路 東端}
  - {source: O8,  target: O9,  note: 南北通路 2}
  - {source: O10, target: O11, note: 南北通路 3}
  - {source: O12, target: O13, note: 南北通路 4}
  - {source: O9,  target: O5,  note: 北側通路 東}
  - {source: O9,  target: O11, note: 北東の斜辺 1}
  - {source: O11, target: O13, note: 北東の斜辺 2}
