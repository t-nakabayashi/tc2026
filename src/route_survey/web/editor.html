<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>経路採取・編集</title><style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#111c2b;color:#f0f4fa}header{padding:12px;background:#1d3048}button,input,select{font:inherit;padding:8px;border-radius:6px;border:1px solid #66809a}button{cursor:pointer;background:#e7eff7;color:#16304a;margin:3px}main{display:grid;grid-template-columns:1fr 310px;height:calc(100vh - 115px)}canvas{width:100%;height:100%;touch-action:none;background:#d5dfe6}aside{padding:12px;overflow:auto}label{display:block;margin:8px 0}input[type=number],input[type=text]{width:100%}.warn{color:#ffcc70}small{line-height:1.5}#status{padding:4px 12px} @media(max-width:750px){main{grid-template-columns:1fr;height:auto}canvas{height:58vh}aside{height:auto}button{font-size:14px}}
</style><header><b>経路採取・編集</b>　<button id="fit">全体</button><button id="zoom_in">＋</button><button id="zoom_out">−</button><button id="undo">元に戻す</button><button id="redo">やり直す</button><button id="add">追加モード</button><button id="csv">CSV保存</button><button id="json">編集用JSON保存</button><button id="png">画像保存</button><label style="display:inline">JSON読込 <input id="load" type="file" accept=".json" style="width:100px"></label></header>
<div id="status"></div><main><canvas id="map"></canvas><aside><label><input type="checkbox" id="photo" checked> 航空写真</label><label><input type="checkbox" id="geo" checked> 地図形状</label><label><input type="checkbox" id="cloud" checked> FAST-LIO点群</label><label><input type="checkbox" id="width" checked> 回避幅</label><label><input type="checkbox" id="gnss_trace" checked> GNSS単独軌跡（受信状態で色分け）</label><label><input type="checkbox" id="fused_trace" checked> 自己位置推定軌跡（水色）</label><small>GNSS: 緑 FIX / 橙 FLOAT / 赤 単独等 / 灰 不明<br>青は編集用waypoint。軌跡は編集しません。</small><label>観測時刻（秒）<input id="trace_time" type="range" min="0" value="0" style="width:100%"></label><pre id="trace_info" style="white-space:pre-wrap;font:14px system-ui"></pre><hr><label>ラベルで検索<input id="search" type="text"></label><button id="find">この点へ</button><b id="selection">Waypointを選択</b><div id="fields"></div><button id="apply">変更を反映</button><button id="delete">選択点を削除</button><button id="tangent">次点へ方位を合わせる</button><button id="confirm">この点を確認済みにする</button><p class="warn" id="quality"></p><small>点をドラッグして位置変更。空白をドラッグして移動、ホイールで拡大。追加モードでは選択点の次へ追加。タップ選択後、数値入力でも編集できます。位置・方位・幅を変更すると現地確認待ちに戻ります。CSV保存は走行中の経路へ自動反映しません。</small><p id="source"></p></aside></main>
<script>
let data=__SURVEY_DATA__, rows=data.waypoints, selected=0, history=[],future=[],adding=false;
const $=id=>document.getElementById(id), canvas=$('map'),ctx=canvas.getContext('2d');
const F=['label','latitude','longitude','altitude','heading_deg','right_is_open','left_is_open','line_is_stop','signal_is_stop','isnot_skipnum'];
let view={x:0,y:0,scale:1}, drag=null, bg=new Image();
const rad=Math.PI/180,A=6378137,E=6.69437999014e-3;
function ecef(lat,lon,h){lat*=rad;lon*=rad;let n=A/Math.sqrt(1-E*Math.sin(lat)**2);return [(n+h)*Math.cos(lat)*Math.cos(lon),(n+h)*Math.cos(lat)*Math.sin(lon),(n*(1-E)+h)*Math.sin(lat)]}
function frame(){let p=data.projection,lat=p.origin_latitude*rad,lon=p.origin_longitude*rad;return {o:ecef(p.origin_latitude,p.origin_longitude,p.origin_altitude),lat,lon,yaw:p.map_yaw_offset_rad||0}}
function xy(row){let f=frame(),p=ecef(+row.latitude,+row.longitude,data.projection.origin_altitude).map((v,i)=>v-f.o[i]),e=-Math.sin(f.lon)*p[0]+Math.cos(f.lon)*p[1],n=-Math.sin(f.lat)*Math.cos(f.lon)*p[0]-Math.sin(f.lat)*Math.sin(f.lon)*p[1]+Math.cos(f.lat)*p[2];return [Math.cos(f.yaw)*e+Math.sin(f.yaw)*n,-Math.sin(f.yaw)*e+Math.cos(f.yaw)*n]}
function llh(x,y){let f=frame(),e=Math.cos(f.yaw)*x-Math.sin(f.yaw)*y,n=Math.sin(f.yaw)*x+Math.cos(f.yaw)*y,z=0,lat,lon;for(let j=0;j<4;j++){let p=[f.o[0]-Math.sin(f.lon)*e-Math.sin(f.lat)*Math.cos(f.lon)*n+Math.cos(f.lat)*Math.cos(f.lon)*z,f.o[1]+Math.cos(f.lon)*e-Math.sin(f.lat)*Math.sin(f.lon)*n+Math.cos(f.lat)*Math.sin(f.lon)*z,f.o[2]+Math.cos(f.lat)*n+Math.sin(f.lat)*z];lon=Math.atan2(p[1],p[0]);let r=Math.hypot(p[0],p[1]);lat=Math.atan2(p[2],r*(1-E));for(let k=0;k<8;k++){let v=A/Math.sqrt(1-E*Math.sin(lat)**2);lat=Math.atan2(p[2]+E*v*Math.sin(lat),r)}let v=A/Math.sqrt(1-E*Math.sin(lat)**2),h=r/Math.cos(lat)-v;z+=data.projection.origin_altitude-h}return [lat/rad,lon/rad]}
function screen(p){return [(p[0]-view.x)*view.scale+canvas.width/2,canvas.height/2-(p[1]-view.y)*view.scale]}
function world(x,y){return [(x-canvas.width/2)/view.scale+view.x,(canvas.height/2-y)/view.scale+view.y]}
function snapshot(){history.push(JSON.stringify(rows));if(history.length>100)history.shift();future=[]}
function mark(row){row.observation={...(row.observation||{}),review_required:true,edited:true}}
function fit(){if(!rows.length)return;let p=rows.map(xy),xs=p.map(v=>v[0]),ys=p.map(v=>v[1]),xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys);view={x:(xmin+xmax)/2,y:(ymin+ymax)/2,scale:Math.min(canvas.width/(xmax-xmin+20),canvas.height/(ymax-ymin+20))};draw()}
function draw(){ctx.fillStyle='#d5dfe6';ctx.fillRect(0,0,canvas.width,canvas.height);
if($('photo').checked&&bg.complete&&bg.naturalWidth&&data.background){let [w,h]=data.background.dimensions,p=screen([-w/2,h/2]);ctx.drawImage(bg,p[0],p[1],w*view.scale,h*view.scale)}
if($('geo').checked){ctx.strokeStyle='#27394b';ctx.lineWidth=1;for(let o of data.obstacles||[]){let v=o.poly||o.vertices||o.polygon||o.footprint;if(!Array.isArray(v)||!v.length)continue;ctx.beginPath();v.forEach((a,i)=>{let p=screen(Array.isArray(a)?a:[a.x,a.y]);i?ctx.lineTo(...p):ctx.moveTo(...p)});ctx.closePath();ctx.stroke()}}
if($('cloud').checked){ctx.fillStyle='#eb3ce4';ctx.globalAlpha=.45;for(let p of data.cloud||[]){let s=screen(p);if(s[0]>=0&&s[0]<canvas.width&&s[1]>=0&&s[1]<canvas.height)ctx.fillRect(s[0],s[1],2,2)}ctx.globalAlpha=1}
drawTraces();
ctx.strokeStyle='#0c7adb';ctx.lineWidth=2;ctx.beginPath();rows.forEach((r,i)=>{let p=screen(xy(r));i?ctx.lineTo(...p):ctx.moveTo(...p)});ctx.stroke();
rows.forEach((r,i)=>{let p=xy(r),s=screen(p),yaw=(90-r.heading_deg)*rad-(data.projection.map_yaw_offset_rad||0);if($('width').checked){ctx.strokeStyle='#24a47a';ctx.lineWidth=3;ctx.beginPath();let l=screen([p[0]-Math.sin(yaw)*r.left_is_open,p[1]+Math.cos(yaw)*r.left_is_open]),q=screen([p[0]+Math.sin(yaw)*r.right_is_open,p[1]-Math.cos(yaw)*r.right_is_open]);ctx.moveTo(...l);ctx.lineTo(...q);ctx.stroke()}ctx.fillStyle=i===selected?'#ffb000':r.signal_is_stop?'#a222d8':r.line_is_stop?'#d63836':'#0575c9';ctx.beginPath();ctx.arc(...s,i===selected?8:4,0,7);ctx.fill();if(i===selected||view.scale>2){ctx.strokeStyle='#102c45';ctx.beginPath();ctx.moveTo(...s);ctx.lineTo(s[0]+Math.cos(yaw)*20,s[1]-Math.sin(yaw)*20);ctx.stroke();ctx.fillStyle='#102c45';ctx.font='14px system-ui';ctx.fillText(r.label,s[0]+8,s[1]-8)}});
$('status').textContent=`${rows.length}点 ｜ 青:経路・方位　緑:回避幅　紫:点群 ｜ ${adding?'追加モード':'選択・移動モード'}`}
function traceColor(p){let state=p.quality?.state;return state===4?'#168448':state===3?'#ef871a':state==null?'#7b828a':'#d13232'}
function drawTraces(){for(let kind of ['gnss','fused']){if(!$(kind==='gnss'?'gnss_trace':'fused_trace').checked)continue;let list=data.traces?.[kind]||[];ctx.lineWidth=kind==='gnss'?4:5;let previous=null;for(let p of list){if(p.x==null||p.y==null){previous=null;continue}if(previous&&p.stamp-previous.stamp<=1){ctx.strokeStyle=kind==='gnss'?traceColor(p):'#00bdcc';ctx.beginPath();ctx.moveTo(...screen([previous.x,previous.y]));ctx.lineTo(...screen([p.x,p.y]));ctx.stroke()}previous=p}}
 let points=data.traces?.gnss||[],p=nearest(points,+$('trace_time').value);if(p?.x!=null&&$('gnss_trace').checked){let q=screen([p.x,p.y]);ctx.strokeStyle='#111';ctx.lineWidth=2;ctx.beginPath();ctx.arc(...q,9,0,7);ctx.stroke()}}
function nearest(list,t){let p=list.reduce((a,b)=>!a||Math.abs(b.stamp-t)<Math.abs(a.stamp-t)?b:a,null);return p&&Math.abs(p.stamp-t)<=.5?p:null}
function inspectTrace(index){let p=(data.traces?.gnss||[])[index]||(data.traces?.fused||[])[0];inspectTime(p?.stamp||0)}
function inspectTime(t){let points=data.traces?.gnss||[],fused=data.traces?.fused||[],all=[...points,...fused];if(!all.length){$('trace_info').textContent='観測履歴なし（旧データから推測して補完しません）';return}$('trace_time').min=all.reduce((v,p)=>Math.min(v,p.stamp),Infinity);$('trace_time').max=all.reduce((v,p)=>Math.max(v,p.stamp),-Infinity);$('trace_time').step=.1;$('trace_time').value=t;let p=nearest(points,t),f=nearest(fused,t);if(!p){$('trace_info').textContent=`時刻 ${t.toFixed(2)} s\nGNSS: 欠測（0.5秒以内の測位なし）\n受信品質: 不明\n自己位置: ${f?.source||data.traces?.source||'gnss'} / ${f?.mode||'データなし'}\n位置分散: ${f?.position_variance?.toFixed(3)||'不明'} m²`;draw();return}let index=points.indexOf(p),q=p.quality,states={4:'FIX',3:'FLOAT',2:'DGPS',1:'単独',0:'UNKNOWN'},show=v=>v==null?'不明':typeof v==='number'&&!Number.isInteger(v)?v.toFixed(3):String(v);
$('trace_info').textContent=`観測 ${index+1}/${points.length} / 時刻 ${p.stamp.toFixed(2)} s
GNSS: ${p.navsat_status<0?'測位無効 / ':''}${q?states[q.state]||'UNKNOWN':'品質欠測'} / NavSat ${p.navsat_status}
衛星数: ${show(q?.satellites)} / HDOP: ${show(q?.hdop)}
基線長: ${q?.baseline_m==null?'不明':q.baseline_m.toFixed(3)+' m'}
補正経過: ${show(q?.correction_age_s)} s
方位標準偏差: ${show(q?.heading_stddev_deg)}°
品質時刻差: ${q?Math.abs(q.stamp-p.stamp).toFixed(3)+' s':'不明'}
自己位置: ${f?.source||data.traces?.source||'gnss'} / ${f?.mode||'同時刻データなし'}
位置分散: ${show(f?.position_variance)} m²${f?.uncertain?' / 要確認':''}`;draw()}
function inspectNearest(x,y){let list=data.traces?.gnss||[],best=-1,distance=15;for(let i=0;i<list.length;i++){let p=list[i];if(p.x==null)continue;let s=screen([p.x,p.y]),d=Math.hypot(x-s[0],y-s[1]);if(d<distance){best=i;distance=d}}if(best>=0)inspectTrace(best)}
$('trace_time').oninput=()=>inspectTime(+$('trace_time').value);
function fields(){let r=rows[selected];$('fields').replaceChildren();$('selection').textContent=r?'Waypoint '+r.label:'未選択';if(!r)return;for(let k of F.filter(k=>k!=='altitude')){let l=document.createElement('label');l.textContent=({label:'ラベル',latitude:'緯度',longitude:'経度',heading_deg:'方位（北0°・時計回り）',right_is_open:'右への回避幅 m',left_is_open:'左への回避幅 m',line_is_stop:'停止',signal_is_stop:'信号停止',isnot_skipnum:'スキップ禁止'})[k];let input=document.createElement('input');input.id='f_'+k;input.type=['line_is_stop','signal_is_stop','isnot_skipnum'].includes(k)?'checkbox':k==='label'?'text':'number';input.step='any';if(input.type==='checkbox')input.checked=!!+r[k];else input.value=r[k];l.append(input);$('fields').append(l)}$('quality').textContent='観測: '+JSON.stringify(r.observation||{review_required:true})}
function refresh(){data.waypoints=rows;fields();draw()}
$('apply').onclick=()=>{if(!rows[selected])return;let r={...rows[selected]};for(let k of F.filter(k=>k!=='altitude')){let i=$('f_'+k);r[k]=i.type==='checkbox'?+i.checked:k==='label'?i.value:Number(i.value)}if(!r.label||rows.some((a,i)=>i!==selected&&a.label===r.label)||!Number.isFinite(r.latitude)||Math.abs(r.latitude)>90||!Number.isFinite(r.longitude)||Math.abs(r.longitude)>180||!Number.isFinite(r.heading_deg)||![r.left_is_open,r.right_is_open].every(v=>Number.isFinite(v)&&v>=0&&v<=20)){alert('値・重複ラベルを確認してください');return}r.heading_deg=(r.heading_deg%360+360)%360;snapshot();mark(r);rows[selected]=r;refresh()};
$('delete').onclick=()=>{if(!rows[selected])return;snapshot();rows.splice(selected,1);selected=Math.min(selected,rows.length-1);refresh()};
$('tangent').onclick=()=>{if(!rows[selected+1])return;snapshot();let p=xy(rows[selected]),q=xy(rows[selected+1]);rows[selected].heading_deg=(90-Math.atan2(q[1]-p[1],q[0]-p[0])/rad-(data.projection.map_yaw_offset_rad||0)/rad+360)%360;mark(rows[selected]);refresh()};
$('undo').onclick=()=>{if(history.length){future.push(JSON.stringify(rows));rows=JSON.parse(history.pop());selected=Math.min(selected,rows.length-1);refresh()}};$('redo').onclick=()=>{if(future.length){history.push(JSON.stringify(rows));rows=JSON.parse(future.pop());refresh()}};
$('zoom_in').onclick=()=>{view.scale=Math.min(150,view.scale*1.5);draw()};$('zoom_out').onclick=()=>{view.scale=Math.max(.1,view.scale/1.5);draw()};$('find').onclick=()=>{let i=rows.findIndex(r=>r.label===$('search').value);if(i<0){alert('ラベルがありません');return}selected=i;let p=xy(rows[i]);view={x:p[0],y:p[1],scale:15};refresh()};$('confirm').onclick=()=>{if(!rows[selected])return;snapshot();rows[selected].observation={...(rows[selected].observation||{}),review_required:false,manually_confirmed:true};refresh()};$('fit').onclick=fit;$('add').onclick=()=>{adding=!adding;draw()};for(let id of ['photo','geo','cloud','width','gnss_trace','fused_trace'])$(id).onchange=draw;
function download(name,text,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('csv').onclick=()=>{let quote=v=>'"'+String(v??'').replaceAll('"','""')+'"';download('waypoints.csv',F.join(',')+'\n'+rows.map(r=>F.map(k=>quote(k==='altitude'?'':r[k])).join(',')).join('\n')+'\n','text/csv;charset=utf-8')};
$('json').onclick=()=>{data.waypoints=rows;data.active=false;download('survey.json',JSON.stringify(data),'application/json')};$('png').onclick=()=>{let a=document.createElement('a');a.download='route_overview.png';a.href=canvas.toDataURL();a.click()};
$('load').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!d.projection||!Array.isArray(d.waypoints)||!d.waypoints.every(r=>F.every(k=>k in r)&&Number.isFinite(+r.latitude)&&Number.isFinite(+r.longitude)))throw Error('形式不正');data=d;rows=d.waypoints;history=[];future=[];selected=0;bg.src=d.background?.image||'';refresh();fit();inspectTrace(0)}catch(err){alert('読込失敗: '+err.message)}};
canvas.onpointerdown=e=>{let rect=canvas.getBoundingClientRect(),sx=(e.clientX-rect.left)*canvas.width/rect.width,sy=(e.clientY-rect.top)*canvas.height/rect.height,p=world(sx,sy);if(adding){snapshot();let ll=llh(...p),label='new_'+Date.now();rows.splice(selected+1,0,{label,latitude:ll[0],longitude:ll[1],altitude:'',heading_deg:0,right_is_open:0,left_is_open:0,line_is_stop:0,signal_is_stop:0,isnot_skipnum:1,observation:{review_required:true}});selected++;adding=false;refresh();return}inspectNearest(sx,sy);let index=rows.findIndex(r=>{let s=screen(xy(r));return Math.hypot(sx-s[0],sy-s[1])<14});if(index>=0){selected=index;snapshot();fields()}drag={index,sx,sy,v:{...view}};canvas.setPointerCapture(e.pointerId);draw()};
canvas.onpointermove=e=>{if(!drag)return;let rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*canvas.width/rect.width,y=(e.clientY-rect.top)*canvas.height/rect.height;if(drag.index>=0){let p=llh(...world(x,y));rows[drag.index].latitude=p[0];rows[drag.index].longitude=p[1];mark(rows[drag.index]);fields()}else{view.x=drag.v.x-(x-drag.sx)/view.scale;view.y=drag.v.y+(y-drag.sy)/view.scale}draw()};canvas.onpointerup=()=>drag=null;canvas.onpointercancel=()=>drag=null;canvas.onwheel=e=>{e.preventDefault();view.scale=Math.max(.1,Math.min(150,view.scale*Math.exp(-e.deltaY*.001)));draw()};
function resize(){canvas.width=canvas.clientWidth;canvas.height=canvas.clientHeight;draw()}window.onresize=resize;bg.onload=draw;if(data.background)bg.src=data.background.image;$('source').textContent=(data.background_notice||'背景未設定')+' '+(data.cloud_source||'');resize();fields();fit();inspectTrace(0);
</script></html>
