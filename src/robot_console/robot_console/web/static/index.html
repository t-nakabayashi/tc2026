<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>robot_console 遠隔観測</title>
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  crossorigin=""
>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="title-row">
    <h1>robot_console 遠隔観測（閲覧専用）</h1>
    <span id="freshness-indicator" class="freshness-indicator">-</span>
  </div>
  <p class="notice">このページは観測専用です。手動介入・起動操作・パラメータ編集はできません。</p>
</header>

<main>
  <section id="summary" class="panel">
    <h2>状態サマリ</h2>
    <dl id="summary-fields" class="fields"></dl>
  </section>

  <section id="events" class="panel">
    <h2>イベント</h2>
    <ul id="event-list" class="event-list"></ul>
  </section>

  <section id="gps-summary" class="panel">
    <h2>GPS/GNSSサマリ</h2>
    <dl id="gps-fields" class="fields"></dl>
  </section>

  <section id="map" class="panel">
    <h2>地図 / Route Overlay</h2>
    <div id="leaflet-map" class="leaflet-map"></div>
    <p id="map-caption" class="caption">-</p>
  </section>

  <section id="sensors" class="panel">
    <h2>センサ・画像パネル</h2>
    <div id="sensor-grid" class="grid"></div>
  </section>

  <section id="health" class="panel">
    <h2>鮮度・稼働状態一覧</h2>
    <table id="health-table">
      <thead>
        <tr><th>Profile</th><th>カテゴリ</th><th>状態</th><th>Health</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="app.js"></script>
</body>
</html>
